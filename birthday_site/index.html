<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>С днём рождения, любимая!</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#000;color:#fff}
  
  /* Lock Screen */
  #lockScreen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0a2e 0%,#16213e 50%,#0f0f23 100%);transition:opacity 0.6s ease,visibility 0.6s}
  #lockScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .lock-icon{width:100px;height:100px;margin-bottom:30px;animation:float 3s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .lock-icon svg{width:100%;height:100%;filter:drop-shadow(0 0 20px rgba(255,100,150,0.5))}
  .lock-title{font-size:clamp(24px,6vw,36px);font-weight:300;letter-spacing:0.1em;text-transform:uppercase;background:linear-gradient(135deg,#ff6496,#ffb3d9,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:12px;text-align:center}
  .lock-hint{font-size:clamp(14px,3.5vw,18px);color:rgba(255,255,255,0.5);text-align:center;margin-bottom:30px;line-height:1.5}
  .lock-input-wrap{display:flex;flex-direction:column;gap:16px;align-items:center;width:100%;max-width:320px;padding:0 20px}
  #passwordInput{width:100%;padding:18px 24px;font-size:18px;text-align:center;background:rgba(255,255,255,0.05);border:2px solid rgba(255,100,150,0.3);border-radius:16px;color:#fff;font-family:inherit;outline:none;transition:border-color 0.3s,box-shadow 0.3s}
  #passwordInput:focus{border-color:#ff6496;box-shadow:0 0 30px rgba(255,100,150,0.2)}
  #passwordInput::placeholder{color:rgba(255,255,255,0.3)}
  #passwordInput.error{border-color:#ff3366;animation:shake 0.4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .error-msg{font-size:15px;color:#ff3366;min-height:22px;text-align:center;opacity:0;transform:translateY(-10px);transition:opacity 0.3s,transform 0.3s}
  .error-msg.show{opacity:1;transform:translateY(0)}
  .submit-btn{width:100%;padding:18px;font-size:18px;font-weight:600;background:linear-gradient(135deg,#ff6496,#e84d7a);border:none;border-radius:16px;color:#fff;font-family:inherit;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s}
  .submit-btn:active{transform:scale(0.97)}
  .submit-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
  
  /* Photo Background */
  #photoBg{position:fixed;inset:0;z-index:1;opacity:0;visibility:hidden;transition:opacity 1s ease,visibility 1s}
  #photoBg.visible{opacity:1;visibility:visible}
  .photo-layer{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.5s ease;filter:brightness(0.7)}
  .photo-layer.active{opacity:1}
  .photo-overlay{position:absolute;inset:0;background:linear-gradient(135deg,rgba(26,10,46,0.8) 0%,rgba(22,33,62,0.6) 50%,rgba(15,15,35,0.9) 100%)}
  
  /* Letter */
  #letter{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.8);z-index:10;opacity:0;visibility:hidden;transition:opacity 0.6s cubic-bezier(0.34,1.56,0.64,1),transform 0.6s cubic-bezier(0.34,1.56,0.64,1),visibility 0.6s;cursor:pointer;perspective:1000px}
  #letter.visible{opacity:1;visibility:visible;transform:translate(-50%,-50%) scale(1)}
  .letter-envelope{width:clamp(280px,70vw,380px);height:clamp(180px,45vw,240px);background:linear-gradient(145deg,#fff0f5 0%,#ffe4ec 50%,#ffd1dc 100%);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.3),0 0 0 1px rgba(255,255,255,0.2),inset 0 1px 0 rgba(255,255,255,0.5);position:relative;transform-style:preserve-3d;transition:transform 0.4s ease}
  #letter:hover .letter-envelope{transform:rotateX(5deg) rotateY(-5deg)}
  .letter-envelope::before{content:'';position:absolute;top:0;left:0;right:0;height:60%;background:linear-gradient(180deg,rgba(255,100,150,0.15) 0%,transparent 100%);border-radius:20px 20px 0 0;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%)}
  .letter-envelope::after{content:'✉';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;opacity:0.3;pointer-events:none}
  .letter-seal{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:48px;height:48px;background:linear-gradient(135deg,#ff6496,#e84d7a);border-radius:50%;box-shadow:0 4px 20px rgba(255,100,150,0.5);display:flex;align-items:center;justify-content:center;font-size:20px}
  .letter-text-hint{position:absolute;bottom:-40px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,0.6);white-space:nowrap;pointer-events:none}
  
  /* Note Paper */
  #note{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity 0.5s ease,visibility 0.5s;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px)}
  #note.visible{opacity:1;visibility:visible}
  .note-paper{width:90%;max-width:420px;max-height:85vh;background:linear-gradient(180deg,#fdf6f8 0%,#fceef2 100%);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,0.4),0 0 0 1px rgba(255,255,255,0.3);padding:clamp(24px,5vw,40px);overflow-y:auto;transform:scale(0.9) translateY(20px);transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1)}
  #note.visible .note-paper{transform:scale(1) translateY(0)}
  .note-paper::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#ff6496,transparent)}
  .note-text{font-size:clamp(15px,3.5vw,18px);line-height:1.8;color:#2d1b2e;white-space:pre-wrap;font-family:'Georgia',serif;text-align:left}
  .note-heart{display:block;text-align:center;font-size:28px;margin:20px 0 10px;animation:heartbeat 1.5s ease-in-out infinite}
  @keyframes heartbeat{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
  .note-continue{display:block;width:100%;margin-top:30px;padding:16px;font-size:17px;font-weight:600;background:linear-gradient(135deg,#ff6496,#e84d7a);border:none;border-radius:14px;color:#fff;font-family:inherit;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;text-align:center}
  .note-continue:active{transform:scale(0.97)}
  
  /* Heart & Matrix */
  #heartMatrix{position:fixed;inset:0;z-index:30;opacity:0;visibility:hidden;transition:opacity 0.5s ease,visibility 0.5s}
  #heartMatrix.visible{opacity:1;visibility:visible}
  .heart-canvas{position:absolute;inset:0}
  .matrix-container{position:absolute;inset:0;overflow:hidden}
  .matrix-column{position:absolute;top:-100vh;white-space:nowrap;font-family:'SF Mono','Fira Code',monospace;font-size:clamp(12px,2.5vw,16px);line-height:1.3;opacity:0;animation:matrixFall 20s linear infinite;will-change:transform,opacity}
  @keyframes matrixFall{0%{transform:translateY(-100vh);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(200vh);opacity:0}}
  
  /* End Screen */
  #endScreen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a0a2e 0%,#16213e 50%,#0f0f23 100%);opacity:0;visibility:hidden;transition:opacity 0.8s ease,visibility 0.8s}
  #endScreen.visible{opacity:1;visibility:visible}
  .end-content{text-align:center;animation:fadeUp 0.8s cubic-bezier(0.34,1.56,0.64,1)}
  @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
  .end-heart{width:120px;height:120px;margin:0 auto 30px;animation:heartbeat 1.5s ease-in-out infinite}
  .end-title{font-size:clamp(28px,7vw,48px);font-weight:300;letter-spacing:0.05em;background:linear-gradient(135deg,#ff6496,#ffb3d9,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px}
  .end-subtitle{font-size:clamp(16px,4vw,22px);color:rgba(255,255,255,0.6);margin-bottom:50px;line-height:1.5}
  .end-btn{padding:20px 60px;font-size:clamp(18px,4vw,24px);font-weight:600;background:linear-gradient(135deg,#ff6496,#e84d7a);border:none;border-radius:18px;color:#fff;font-family:inherit;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 10px 40px rgba(255,100,150,0.4)}
  .end-btn:active{transform:scale(0.95)}
  .end-btn:focus-visible{outline:2px solid #fff;outline-offset:4px}
  
  /* Reduced motion */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}
  }
  
  /* Touch optimizations */
  @media (hover:none){#letter:hover .letter-envelope{transform:none}}
  button,input{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<!-- Lock Screen -->
<div id="lockScreen" role="dialog" aria-label="Введите пароль">
  <div class="lock-icon" aria-hidden="true">
    <svg viewBox="0 0 100 100" fill="none">
      <path d="M50 20 C50 10 60 10 60 20 L60 50 C60 60 50 70 50 70 C40 70 30 60 30 50 L30 20 C30 10 40 10 40 20 L40 30 L60 30 L60 20" stroke="#ff6496" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="50" cy="38" r="12" fill="#ff6496" opacity="0.2"/>
    </svg>
  </div>
  <h1 class="lock-title">Введите пароль</h1>
  <p class="lock-hint">пароль — имя и возраст<br>(ответ: Вероника 19)</p>
  <div class="lock-input-wrap">
    <input type="password" id="passwordInput" placeholder="Введите пароль" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Пароль">
    <p id="errorMsg" class="error-msg" aria-live="polite"></p>
    <button class="submit-btn" id="submitBtn" type="button">Открыть</button>
  </div>
</div>

<!-- Photo Background -->
<div id="photoBg" aria-hidden="true">
  <div class="photo-layer" id="photoLayer1"></div>
  <div class="photo-layer" id="photoLayer2"></div>
  <div class="photo-layer" id="photoLayer3"></div>
  <div class="photo-layer" id="photoLayer4"></div>
  <div class="photo-overlay"></div>
</div>

<!-- Letter -->
<div id="letter" role="button" tabindex="0" aria-label="Открыть письмо">
  <div class="letter-envelope">
    <div class="letter-seal">♥</div>
  </div>
  <p class="letter-text-hint">Нажмите, чтобы открыть</p>
</div>

<!-- Note Paper -->
<div id="note" role="dialog" aria-label="Поздравление" aria-modal="true">
  <div class="note-paper">
    <div class="note-text" id="noteText"></div>
    <span class="note-heart" aria-hidden="true">♥</span>
    <button class="note-continue" id="continueBtn" type="button">Далее →</button>
  </div>
</div>

<!-- Heart & Matrix -->
<div id="heartMatrix" aria-hidden="true">
  <canvas class="heart-canvas" id="heartCanvas"></canvas>
  <div class="matrix-container" id="matrixContainer"></div>
</div>

<!-- End Screen -->
<div id="endScreen" role="dialog" aria-label="Финал">
  <div class="end-content">
    <div class="end-heart" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none">
        <path d="M60 25 C60 10 85 10 85 35 C85 55 60 95 60 95 C60 95 35 55 35 35 C35 10 60 10 60 25" stroke="#ff6496" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M60 25 C60 10 85 10 85 35 C85 55 60 95 60 95 C60 95 35 55 35 35 C35 10 60 10 60 25" fill="#ff6496" opacity="0.15"/>
      </svg>
    </div>
    <h1 class="end-title">HAPPY BERTHDAY</h1>
    <p class="end-subtitle">Люблю тебя бесконечно<br>Твой навсегда ♥</p>
    <button class="end-btn" id="endBtn" type="button">Конец</button>
  </div>
</div>

<script>
// ===== CONFIG =====
const CORRECT_PASSWORD = 'Вероника 19';
const PHOTOS = [
  'fotki/IMG_20260921_220755_763.jpg',
  'fotki/IMG_20260921_221333_990.jpg',
  'fotki/IMG_20261014_092120_582.jpg',
  'fotki/IMG_20261015_220115_710.jpg',
  'fotki/IMG_20261015_220119_413.jpg',
  'fotki/IMG_20261015_220123_430.jpg',
  'fotki/IMG_20261015_220131_053.jpg',
  'fotki/IMG_20261015_220132_687.jpg',
  'fotki/IMG_20261015_220148_025.jpg',
  'fotki/IMG_20261015_220149_753.jpg',
  'fotki/IMG_20261015_220151_126.jpg',
  'fotki/IMG_20261015_220152_003.jpg',
  'fotki/IMG_20261015_220318_110.jpg',
  'fotki/IMG_20261015_220319_772.jpg',
  'fotki/IMG_20261015_220322_208.jpg',
  'fotki/IMG_20261015_220319_772.jpg'
];
const NOTE_TEXT = `Вот тебе и 19 моя принцесса, мы с тобой уже достаточно долго и это мои самые трогательные, важные, интересные, любимые, долгие и лучшие отношения. То что я планирую с тобой семью и дальнейшую жизнь это очень важно для меня и я на эту тему говорю и говорил только с тобой мне очень приятно быть с тобой. Я тебя люблю каждую твою частичку, грустную, пьяную, резвую, сильную и независимую, раздражённую, возбуждённую, правильную, злую, сонную, ревящую, милую. Я очень сильно люблю твою улыбку, недавольную гримассу, твои глаза, твой голос, твои стоны хоть и редко слышу. Я очень сильно надеюсь что это всё не зря и надеюсь с тобой прожить до конца как минимум своих дней и в любви и радости или грусти, в огонии и страсти и негадовании. Люблю тебя очень сильно и с днём рождения ещё раз!`;
const MATRIX_TEXT = 'HAPPY BERTHDAY';
const MATRIX_COLUMNS = 18;

// ===== DOM ELEMENTS =====
const lockScreen = document.getElementById('lockScreen');
const passwordInput = document.getElementById('passwordInput');
const submitBtn = document.getElementById('submitBtn');
const errorMsg = document.getElementById('errorMsg');
const photoBg = document.getElementById('photoBg');
const photoLayers = [
  document.getElementById('photoLayer1'),
  document.getElementById('photoLayer2'),
  document.getElementById('photoLayer3'),
  document.getElementById('photoLayer4')
];
const letter = document.getElementById('letter');
const note = document.getElementById('note');
const noteText = document.getElementById('noteText');
const continueBtn = document.getElementById('continueBtn');
const heartMatrix = document.getElementById('heartMatrix');
const heartCanvas = document.getElementById('heartCanvas');
const matrixContainer = document.getElementById('matrixContainer');
const endScreen = document.getElementById('endScreen');
const endBtn = document.getElementById('endBtn');

// ===== STATE =====
let currentPhotoIndex = 0;
let photoInterval = null;
let heartAnimationId = null;
let matrixColumns = [];
let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

// ===== UTILS =====
const $ = (sel, ctx=document) => ctx.querySelector(sel);
const $$ = (sel, ctx=document) => [...ctx.querySelectorAll(sel)];

function show(el){el.classList.add('visible');el.classList.remove('hidden');el.hidden=false}
function hide(el){el.classList.remove('visible');el.classList.add('hidden');el.hidden=true}
function preloadImages(urls){urls.forEach(u=>{const img=new Image();img.src=u})}

// ===== PASSWORD CHECK =====
function checkPassword(){
  const val = passwordInput.value.trim();
  if(val === CORRECT_PASSWORD){
    passwordInput.classList.remove('error');
    errorMsg.classList.remove('show');
    unlock();
  }else{
    passwordInput.classList.add('error');
    errorMsg.textContent = 'поздравление не тебе';
    errorMsg.classList.add('show');
    passwordInput.value = '';
    passwordInput.focus();
  }
}

submitBtn.addEventListener('click', checkPassword);
passwordInput.addEventListener('keydown', e=>{if(e.key==='Enter')checkPassword()});

// ===== UNLOCK SEQUENCE =====
function unlock(){
  hide(lockScreen);
  show(photoBg);
  startPhotoRotation();
  setTimeout(()=>{show(letter);letter.focus()}, 800);
}

// ===== PHOTO ROTATION =====
function setPhoto(layerIdx, photoIdx){
  const layer = photoLayers[layerIdx];
  layer.style.backgroundImage = `url('${PHOTOS[photoIdx]}')`;
  $$('.photo-layer').forEach(l=>l.classList.remove('active'));
  layer.classList.add('active');
}

function startPhotoRotation(){
  // Set initial 4 photos
  PHOTOS.slice(0,4).forEach((p,i)=>setPhoto(i, i));
  currentPhotoIndex = 4;
  
  photoInterval = setInterval(()=>{
    const layerIdx = currentPhotoIndex % 4;
    setPhoto(layerIdx, currentPhotoIndex % PHOTOS.length);
    currentPhotoIndex++;
  }, 3500);
}

// ===== LETTER INTERACTION =====
function openNote(){
  hide(letter);
  noteText.textContent = NOTE_TEXT;
  show(note);
}

letter.addEventListener('click', openNote);
letter.addEventListener('keydown', e=>{if(e.key==='Enter'||e.key===' ')openNote()});

// ===== CONTINUE TO HEART MATRIX =====
continueBtn.addEventListener('click', ()=>{
  hide(note);
  show(heartMatrix);
  startHeartAnimation();
  startMatrixAnimation();
});

// ===== HEART ANIMATION (Canvas) =====
function resizeHeartCanvas(){
  const dpr = Math.min(window.devicePixelRatio, 2);
  heartCanvas.width = window.innerWidth * dpr;
  heartCanvas.height = window.innerHeight * dpr;
  heartCanvas.style.width = '100%';
  heartCanvas.style.height = '100%';
  return dpr;
}

function drawHeart(ctx, w, h, t, dpr){
  const cx = w/2, cy = h/2;
  const scale = Math.min(w, h) * 0.0035 * dpr;
  
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  
  // Heart path
  ctx.beginPath();
  for(let a=0; a<Math.PI*2; a+=0.01){
    const x = 16 * Math.sin(a)**3;
    const y = -(13*Math.cos(a) - 5*Math.cos(2*a) - 2*Math.cos(3*a) - Math.cos(4*a));
    if(a===0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  
  // Glow layers
  const pulse = 1 + 0.15 * Math.sin(t * 3);
  for(let i=5; i>0; i--){
    ctx.save();
    ctx.scale(pulse, pulse);
    ctx.strokeStyle = `rgba(255,100,150,${0.08 * i})`;
    ctx.lineWidth = i * 2;
    ctx.stroke();
    ctx.restore();
  }
  
  // Main heart
  const grad = ctx.createRadialGradient(0, -20, 0, 0, -20, 20);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.3, '#ff6496');
  grad.addColorStop(1, '#e84d7a');
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Inner shine
  ctx.beginPath();
  for(let a=0; a<Math.PI*2; a+=0.01){
    const x = 12 * Math.sin(a)**3;
    const y = -(10*Math.cos(a) - 4*Math.cos(2*a) - 1.5*Math.cos(3*a) - 0.8*Math.cos(4*a));
    if(a===0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fill();
  
  ctx.restore();
}

function animateHeart(){
  const ctx = heartCanvas.getContext('2d');
  const dpr = resizeHeartCanvas();
  const w = heartCanvas.width, h = heartCanvas.height;
  let start = performance.now();
  
  function frame(now){
    const t = (now - start) / 1000;
    ctx.clearRect(0, 0, w, h);
    drawHeart(ctx, w, h, t, dpr);
    heartAnimationId = requestAnimationFrame(frame);
  }
  heartAnimationId = requestAnimationFrame(frame);
}

function startHeartAnimation(){
  animateHeart();
  window.addEventListener('resize', resizeHeartCanvas, {passive:true});
}

function stopHeartAnimation(){
  if(heartAnimationId) cancelAnimationFrame(heartAnimationId);
  window.removeEventListener('resize', resizeHeartCanvas);
}

// ===== MATRIX ANIMATION =====
function createMatrixColumns(){
  matrixContainer.innerHTML = '';
  matrixColumns = [];
  
  const chars = MATRIX_TEXT.split('');
  const colCount = Math.min(MATRIX_COLUMNS, Math.floor(window.innerWidth / 60));
  
  for(let i=0; i<colCount; i++){
    const col = document.createElement('div');
    col.className = 'matrix-column';
    col.style.left = `${(i / colCount) * 100}%`;
    col.style.animationDelay = `${Math.random() * 20}s`;
    col.style.animationDuration = `${15 + Math.random() * 10}s`;
    col.style.color = `rgba(255, ${100 + Math.random()*100}, ${150 + Math.random()*50}, ${0.4 + Math.random()*0.4})`;
    col.style.fontWeight = Math.random() > 0.5 ? '600' : '300';
    
    // Build column text
    let text = '';
    const charCount = 30 + Math.floor(Math.random() * 20);
    for(let j=0; j<charCount; j++){
      text += chars[Math.floor(Math.random() * chars.length)] + (j % 3 === 2 ? '<br>' : ' ');
    }
    col.innerHTML = text;
    
    matrixContainer.appendChild(col);
    matrixColumns.push(col);
  }
}

function startMatrixAnimation(){
  createMatrixColumns();
  window.addEventListener('resize', debounce(createMatrixColumns, 200), {passive:true});
}

function debounce(fn, ms){
  let t; return (...args)=>{clearTimeout(t); t=setTimeout(()=>fn(...args), ms)}
}

// ===== END SCREEN =====
endBtn.addEventListener('click', ()=>{
  // Try to close window (works if opened via window.open)
  window.close();
  // Fallback for iOS/standalone
  show(endScreen);
  endScreen.innerHTML = `
    <div class="end-content" style="animation:none">
      <div class="end-heart" style="width:100px;height:100px;margin:0 auto 20px">
        <svg viewBox="0 0 120 120" fill="none">

// ===== INIT =====
document.addEventListener('DOMContentLoaded', ()=>{
  preloadImages(PHOTOS);
  passwordInput.focus();
  
  // Prevent zoom on iOS
  document.addEventListener('gesturestart', e=>e.preventDefault(), {passive:false});
  document.addEventListener('touchmove', e=>{if(e.touches.length>1)e.preventDefault()}, {passive:false});
  
  // Prevent pull-to-refresh on iOS
  let lastY = 0;
  document.addEventListener('touchstart', e=>{lastY = e.touches[0].clientY}, {passive:true});
  document.addEventListener('touchmove', e=>{
    const y = e.touches[0].clientY;
    const scrollTop = window.scrollY || document.documentElement.scrollTop;
    if(scrollTop === 0 && y > lastY) e.preventDefault();
    lastY = y;
  }, {passive:false});
});

// Cleanup on unload
window.addEventListener('beforeunload', ()=>{
  if(photoInterval) clearInterval(photoInterval);
  stopHeartAnimation();
});
</script>
